name : CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

   

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: maven

      - name: Build with Gradle
        run: ./gradlew build

      - name: Build with Maven
        run: mvn clean compile -B
        env:
            SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/devflow
            SPRING_DATASOURCE_USERNAME: devflow
            SPRING_DATASOURCE_PASSWORD: devflow
            SPRING_DATA_REDIS_HOST: localhost
            SPRING_DATA_REDIS_PORT: 6379
            JWT_SECRET: 404D635166546A576E5A7234753778214125442A472D4B6150645367566B5970